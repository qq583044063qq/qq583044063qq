name: Generate Profile Statistics

on:
  schedule:
    # UTC 19:15 = Beijing 03:15; staggered from WakaTime at 02:30
    - cron: '15 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate GitHub SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: qq583044063qq
          # Include all accessible private repositories by default. Set repo variable to false to opt out.
          PROFILE_INCLUDE_PRIVATE: ${{ vars.PROFILE_INCLUDE_PRIVATE || 'true' }}
          # Fine-grained PAT (Metadata: read) with selected private repos
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/generate_profile_stats.py
      - name: Generate local GitHub Streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: qq583044063qq
        run: python scripts/generate_streak_stats.py
      - name: Commit generated SVG cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg README.md
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "chore: refresh profile statistics SVGs [skip ci]"
          # Another workflow may update the README at the same time.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not push SVG updates after retries" >&2
          exit 1
